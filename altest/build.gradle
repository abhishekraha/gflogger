configurations {
    allocation
}

dependencies {
    implementation(project(':core'))

    allocation(group: 'com.google.code.java-allocation-instrumenter', name: 'java-allocation-instrumenter', version: '3.3.4')
    testImplementation(group: 'com.google.code.java-allocation-instrumenter', name: 'java-allocation-instrumenter', version: '3.3.4')
    testImplementation(group: 'junit', name: 'junit', version: '4.+')
    testImplementation(group: 'org.apache.logging.log4j', name: 'log4j-core', version: '2.25.1')

    testImplementation(group: 'commons-logging', name: 'commons-logging', version: '1.1.3')
    testImplementation(group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.18')
    testImplementation(group: 'org.slf4j', name: 'slf4j-api', version: '1.7.13')
}

test {
    jvmArgs = ["-javaagent:", configurations.allocation.find { it.name.startsWith("java-allocation-instrumenter") }.getAbsolutePath()]
}
