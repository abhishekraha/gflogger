configurations {
    allocation
}

dependencies {
    implementation(project(':core'))

    allocation(group: 'com.google.code.java-allocation-instrumenter', name:'java-allocation-instrumenter', version: '3.0.1')
    testImplementation(group: 'com.google.code.java-allocation-instrumenter', name:'java-allocation-instrumenter', version: '3.0.1')
    testImplementation(group: 'junit', name: 'junit', version: '4.+')
    testImplementation(group: 'log4j', name: 'log4j', version: '1.2.17')

    testImplementation(group: 'commons-logging', name: 'commons-logging', version: '1.1.3')
    testImplementation(group: 'ch.qos.logback', name:'logback-classic', version: '1.0.13')
    testImplementation(group: 'org.slf4j', name: 'slf4j-api', version: '1.7.13')
}

test {
    jvmArgs = ["-javaagent:" , configurations.allocation.find{ it.name.startsWith("java-allocation-instrumenter")}.getAbsolutePath()]
}
